<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">Branford Hornet pathway into the future</title>
  <desc id="desc">A red and black abstract pathway moving through a honeycomb toward the horizon, with subtle hornet flight marks.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f7f8"/>
      <stop offset="0.48" stop-color="#d8d8dc"/>
      <stop offset="1" stop-color="#171719"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f0d25"/>
      <stop offset="1" stop-color="#df2748"/>
    </linearGradient>
    <pattern id="hive" width="92" height="80" patternUnits="userSpaceOnUse">
      <path d="M23 2h46l23 38-23 38H23L0 40z" fill="none" stroke="#ffffff" stroke-opacity=".13" stroke-width="3"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1600" height="650" fill="url(#sky)"/>
  <path d="M780 650C900 535 1000 475 1085 414c115-82 190-176 274-414h241v650z" fill="#151517" opacity=".9"/>
  <rect x="930" width="670" height="650" fill="url(#hive)"/>
  <path d="M650 650C800 535 920 494 1022 411c104-85 165-185 209-411h151c-48 261-126 393-254 496-97 79-203 119-315 154z" fill="#f5f5f6" opacity=".93" filter="url(#shadow)"/>
  <path d="M762 650c119-94 228-142 322-220 93-77 153-186 196-430" fill="none" stroke="url(#red)" stroke-width="30" stroke-linecap="round" opacity=".93"/>
  <g fill="#b41331" opacity=".62" transform="translate(1040 362) rotate(-31)">
    <ellipse cx="0" cy="0" rx="24" ry="16"/>
    <ellipse cx="-26" cy="-18" rx="18" ry="10" transform="rotate(-28)"/>
    <ellipse cx="-25" cy="18" rx="18" ry="10" transform="rotate(28)"/>
    <path d="M20-8l33-18-23 28 28 18-39-9z"/>
  </g>
  <path d="M1090 330c90-80 155-122 249-145" fill="none" stroke="#d92343" stroke-width="5" stroke-linecap="round" stroke-dasharray="4 18" opacity=".7"/>
  <g fill="none" stroke="#c71936" stroke-width="9" opacity=".48">
    <path d="M1290 84h70l35 58-35 58h-70l-35-58z"/>
    <path d="M1404 182h70l35 58-35 58h-70l-35-58z"/>
    <path d="M1277 282h70l35 58-35 58h-70l-35-58z"/>
  </g>
  <circle cx="1262" cy="71" r="10" fill="#ed3b58"/>
  <circle cx="1312" cy="52" r="6" fill="#ed3b58" opacity=".8"/>
</svg>
