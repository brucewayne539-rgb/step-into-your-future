services:
  - type: web
    name: step-into-your-future-demo
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 300
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MAX_GENERATIONS_PER_SESSION
        value: "2"
      - key: MAX_ADMIN_PREVIEW_GENERATIONS
        value: "6"
      # Temporary sales/presentation feature. It uses only bundled fictional
      # people and can be hidden after a pilot/contract by changing this to 0.
      - key: ADMIN_PREVIEW_ENABLED
        value: "1"
      # Legacy flags retained for compatibility; real-photo endpoints are retired
      # in source and cannot be enabled by these values.
      - key: PORTRAITS_ENABLED
        value: "0"
      - key: OPENAI_ZDR_CONFIRMED
        value: "0"
      - key: SCHOOL_PORTRAIT_APPROVED
        value: "0"
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: OPERATOR_NAME
        value: "Step Into Your Future"
